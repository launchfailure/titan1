name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # required for Sigstore keyless signing

jobs:
  build-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build sigstore

      - name: Verify SBOM is up to date
        # The committed SBOM must match a fresh deterministic regeneration.
        run: |
          python tools/gen_sbom.py --out /tmp/sbom.cdx.json
          diff -u docs/sbom.cdx.json /tmp/sbom.cdx.json

      - name: Reproducible build
        # Pin SOURCE_DATE_EPOCH to the tagged commit time for byte-reproducible
        # sdist/wheel artifacts. bdist_wheel honors it natively; the sdist does
        # not (setuptools embeds filesystem mtimes), so it is normalized by
        # tools/repack_sdist.py after the build.
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          python -m build
          python tools/repack_sdist.py dist/*.tar.gz

      - name: Sign artifacts (Sigstore, keyless)
        run: |
          for f in dist/*.whl dist/*.tar.gz; do
            python -m sigstore sign "$f"
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sigstore*
            docs/sbom.cdx.json
