name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff mypy pytest-cov hypothesis jsonschema

      - name: Lint
        run: |
          ruff check .

      - name: Type check (mypy)
        # Non-strict baseline; type errors block merge. See [tool.mypy] in
        # pyproject.toml for the ratchet list of legacy modules.
        run: |
          mypy titan_decoder/

      - name: Run tests with coverage floor
        # Coverage floor fails the build on regressions (current ~74%).
        run: |
          pytest -q --cov=titan_decoder --cov-report=term-missing --cov-fail-under=70

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Fuzz decoders/analyzers (bounded budget)
        # Time-bounded so CI stays fast; enforces the never-raise / bounded-
        # output / bounded-time invariants over random + corpus-derived inputs.
        run: |
          python fuzz/fuzz_decoders.py --seconds 60

      - name: Performance regression gate
        # Deterministic node counts checked exactly; wall-clock is normalized
        # against a calibration workload so a slow runner does not false-fail.
        run: |
          python tools/bench.py --check
